<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="NEXUS — Plataforma de Inteligencia del Aprendizaje">
  <title>NEXUS — Laboratorio de aprendizaje</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #090d18;
      --bg-2: #0d1323;
      --panel: #11192b;
      --panel-2: #151f34;
      --panel-3: #1a2740;
      --ink: #eef3ff;
      --muted: #93a1bc;
      --subtle: #64728c;
      --line: rgba(173, 192, 227, .14);
      --line-strong: rgba(173, 192, 227, .26);
      --cyan: #75e6df;
      --violet: #a99bff;
      --coral: #ff9a86;
      --yellow: #e7cf84;
      --green: #8ed29d;
      --blue: #83b9ff;
      --danger: #ff8c9d;
      --shadow: 0 22px 80px rgba(0, 0, 0, .28);
      --radius: 18px;
      --radius-sm: 12px;
      --font: 'Manrope', system-ui, sans-serif;
      --mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% -10%, rgba(107, 98, 210, .16), transparent 31rem),
        radial-gradient(circle at 8% 30%, rgba(72, 162, 177, .08), transparent 28rem),
        var(--bg);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.55;
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
    a { color: inherit; }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Shared UI */
    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 11px 16px;
      color: var(--ink);
      background: var(--panel-3);
      transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .btn:hover { transform: translateY(-2px); background: #223252; border-color: var(--line-strong); }
    .btn:active { transform: translateY(0); }
    .btn.primary {
      color: #09131b;
      background: var(--cyan);
      box-shadow: 0 8px 25px rgba(117, 230, 223, .16);
    }
    .btn.primary:hover { background: #a6f6ed; }
    .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
    .btn.ghost:hover { color: var(--ink); background: rgba(255,255,255,.05); }
    .btn.danger { background: rgba(255, 140, 157, .12); color: var(--danger); border-color: rgba(255, 140, 157, .22); }
    .btn.small { padding: 8px 11px; font-size: 12px; border-radius: 8px; }
    .btn.icon { display: inline-flex; align-items: center; justify-content: center; width: 39px; height: 39px; padding: 0; }
    .icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
    .eyebrow {
      color: var(--cyan); font-family: var(--mono); font-size: 11px;
      letter-spacing: .13em; text-transform: uppercase;
    }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; color: var(--subtle); }
    .mono { font-family: var(--mono); }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 8px; border-radius: 6px; font-family: var(--mono);
      font-size: 10px; font-weight: 500; letter-spacing: .08em;
    }
    .badge.evidence { color: var(--yellow); background: rgba(231, 207, 132, .10); border: 1px solid rgba(231,207,132,.2); }
    .badge.observation { color: var(--cyan); background: rgba(117,230,223,.10); border: 1px solid rgba(117,230,223,.2); }
    .badge.hypothesis { color: var(--violet); background: rgba(169,155,255,.11); border: 1px solid rgba(169,155,255,.21); }
    .badge.status { color: var(--blue); background: rgba(131,185,255,.1); border: 1px solid rgba(131,185,255,.18); }
    .chip {
      display: inline-flex; align-items: center; border: 1px solid var(--line);
      color: var(--muted); border-radius: 7px; padding: 5px 9px; font-size: 12px;
    }
    .progress-track { height: 6px; background: rgba(255,255,255,.08); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--violet)); transition: width .7s cubic-bezier(.2,.7,.2,1); }
    .card {
      background: linear-gradient(145deg, rgba(25, 37, 62, .91), rgba(14, 22, 39, .94));
      border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .card.pad { padding: 22px; }
    .card-header { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; margin-bottom: 18px; }
    .card-header h3, .card-header h2 { margin: 0; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: clamp(29px, 4vw, 48px); letter-spacing: -.055em; line-height: 1.05; margin-bottom: 10px; }
    h2 { font-size: clamp(23px, 3vw, 34px); letter-spacing: -.045em; line-height: 1.12; }
    h3 { font-size: 17px; letter-spacing: -.025em; line-height: 1.25; }
    h4 { font-size: 14px; margin-bottom: 6px; }
    .section-head { margin: 6px 0 24px; display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    .section-head h2 { margin: 2px 0 5px; }
    .section-head p { color: var(--muted); margin: 0; max-width: 650px; }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .space-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .divider { height: 1px; background: var(--line); margin: 18px 0; }
    .empty {
      padding: 38px 20px; text-align: center; border: 1px dashed var(--line-strong);
      border-radius: var(--radius-sm); color: var(--muted); background: rgba(255,255,255,.018);
    }
    .empty .empty-mark {
      display: inline-grid; place-items: center; width: 45px; height: 45px; margin-bottom: 12px;
      border-radius: 50%; border: 1px solid rgba(117,230,223,.27); color: var(--cyan);
    }
    .empty h3 { color: var(--ink); margin-bottom: 6px; }
    .toast-region { position: fixed; z-index: 200; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      min-width: 250px; max-width: 380px; padding: 13px 15px; border: 1px solid var(--line-strong);
      background: #182541; border-radius: 11px; box-shadow: var(--shadow); animation: toast-in .3s ease both;
    }
    .toast.success { border-color: rgba(117,230,223,.36); }
    .toast strong { display: block; font-size: 13px; }
    .toast span { color: var(--muted); font-size: 12px; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Splash and narrative onboarding */
    .splash {
      position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; overflow: hidden;
      background: #070b15; transition: opacity .6s ease, visibility .6s ease;
    }
    .splash.fade { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-grid { position: absolute; inset: -20%; opacity: .32; background-image: linear-gradient(rgba(117,230,223,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(117,230,223,.07) 1px, transparent 1px); background-size: 70px 70px; transform: perspective(500px) rotateX(60deg) translateY(20%); }
    .splash-orbit { position: absolute; width: min(70vw, 640px); aspect-ratio: 1; border: 1px solid rgba(117,230,223,.12); border-radius: 50%; box-shadow: 0 0 80px rgba(117,230,223,.08), inset 0 0 80px rgba(169,155,255,.06); animation: breathe 5s ease-in-out infinite; }
    .splash-orbit:before, .splash-orbit:after { content: ""; position: absolute; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 26px var(--cyan); }
    .splash-orbit:before { width: 7px; height: 7px; left: 15%; top: 18%; }
    .splash-orbit:after { width: 5px; height: 5px; right: 17%; bottom: 22%; background: var(--violet); box-shadow: 0 0 22px var(--violet); }
    @keyframes breathe { 50% { transform: scale(1.06) rotate(6deg); opacity: .75; } }
    .splash-content { position: relative; text-align: center; padding: 28px; animation: rise .9s .1s both; }
    .splash-content .brand-mark { margin: 0 auto 28px; }
    .splash-content h1 { font-size: clamp(52px, 12vw, 124px); letter-spacing: .15em; margin-right: -.15em; }
    .splash-subtitle { color: var(--muted); font-size: 16px; }
    .splash-tagline { margin: 35px 0 0; color: var(--cyan); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    .splash-actions { margin-top: 30px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .brand-mark { position: relative; display: grid; place-items: center; width: 49px; height: 49px; border: 1px solid rgba(117,230,223,.45); border-radius: 14px; color: var(--cyan); }
    .brand-mark:before, .brand-mark:after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 13px currentColor; }
    .brand-mark:before { top: 8px; right: 8px; }
    .brand-mark:after { bottom: 8px; left: 8px; color: var(--violet); }
    .brand-mark svg { width: 24px; }

    .onboarding {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
      background: radial-gradient(circle at 50% 0%, rgba(82, 67, 170, .18), transparent 40rem), var(--bg);
    }
    .onboarding-shell { width: min(920px, 100%); position: relative; }
    .onboarding-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
    .onboarding-counter { color: var(--subtle); font-family: var(--mono); font-size: 11px; }
    .story { min-height: 510px; display: grid; align-content: center; position: relative; }
    .story-content { max-width: 710px; animation: scene-in .55s ease both; }
    @keyframes scene-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .story h1 { max-width: 800px; }
    .story .lead { color: var(--muted); font-size: clamp(18px, 2.8vw, 25px); line-height: 1.45; max-width: 680px; }
    .story .big-quote { color: var(--ink); font-size: clamp(32px, 6vw, 72px); line-height: 1.04; letter-spacing: -.06em; max-width: 780px; margin: 25px 0; }
    .story .big-quote em { color: var(--cyan); font-style: normal; }
    .story-lines { display: grid; gap: 6px; margin: 20px 0 32px; }
    .story-lines p { margin: 0; color: var(--muted); font-size: 18px; }
    .story-lines p:nth-last-child(1) { color: var(--ink); font-size: 26px; margin-top: 16px; }
    .story-actions { margin-top: 35px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .scene-art { position: absolute; right: 0; top: 50%; width: 310px; transform: translateY(-50%); opacity: .75; pointer-events: none; }
    .scene-art .line { stroke: rgba(117,230,223,.55); stroke-width: 1; fill: none; }
    .scene-art .node { fill: var(--panel-3); stroke: var(--cyan); stroke-width: 1.5; }
    .bar-comparison { width: min(520px, 100%); margin: 28px 0; }
    .bar-row { display: grid; grid-template-columns: 145px 1fr 42px; gap: 12px; align-items: center; margin: 13px 0; font-size: 12px; color: var(--muted); }
    .bar-row .bar { height: 17px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
    .bar-row .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--violet), var(--cyan)); animation: grow 1.2s .3s both; transform-origin: left; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .story .science-card { display: inline-flex; gap: 15px; align-items: center; margin: 12px 0 24px; padding: 13px 16px; background: rgba(117,230,223,.06); border: 1px solid rgba(117,230,223,.2); border-radius: 10px; color: var(--muted); }
    .science-card strong { color: var(--cyan); font-size: 12px; font-family: var(--mono); }
    .science-card .science-image { flex: 0 0 120px; width: 120px; height: 120px; border-radius: 12px; overflow: hidden; background: linear-gradient(120deg, rgba(117,230,223,.06), rgba(169,155,255,.04)); display: block; }
    .science-card .science-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (max-width: 640px) {
      .story .science-card { flex-direction: column; align-items: stretch; }
      .science-card .science-image { width: 100%; height: auto; flex: 0 0 auto; border-radius: 10px; }
      .science-card .science-image img { height: auto; }
    }
    .cycle { width: 220px; height: 220px; margin: 25px 0; border: 1px dashed rgba(117,230,223,.4); border-radius: 50%; display: grid; place-items: center; position: relative; }
    .cycle:before { content: ""; position: absolute; inset: 23px; border: 1px solid rgba(169,155,255,.45); border-radius: 50%; transform: rotate(30deg); }
    .cycle strong { color: var(--cyan); text-align: center; font-size: 16px; z-index: 1; }
    .cycle span { position: absolute; font-size: 10px; color: var(--muted); }
    .cycle span:nth-child(2) { top: 10px; } .cycle span:nth-child(3) { right: -10px; top: 90px; } .cycle span:nth-child(4) { bottom: 7px; left: 57px; } .cycle span:nth-child(5) { left: -25px; top: 90px; }

    /* Main app shell */
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 232px 1fr; }
    .sidebar { position: sticky; top: 0; height: 100vh; padding: 23px 15px; border-right: 1px solid var(--line); background: rgba(9,13,24,.76); backdrop-filter: blur(16px); z-index: 20; display: flex; flex-direction: column; }
    .side-brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 27px; }
    .side-brand .brand-mark { width: 35px; height: 35px; border-radius: 9px; }
    .side-brand .brand-mark svg { width: 18px; }
    .side-brand strong { letter-spacing: .16em; font-size: 15px; }
    .side-label { color: var(--subtle); font-family: var(--mono); text-transform: uppercase; letter-spacing: .12em; font-size: 9px; margin: 8px 10px 9px; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 11px; border: 1px solid transparent; color: var(--muted); background: transparent; border-radius: 9px; padding: 10px 10px; width: 100%; text-align: left; font-size: 13px; transition: .2s ease; }
    .nav-item:hover { color: var(--ink); background: rgba(255,255,255,.04); }
      .nav-item.active { color: var(--cyan); background: rgba(117,230,223,.08); border-color: rgba(117,230,223,.15); }
    .nav-item .icon { width: 16px; height: 16px; }
    .sidebar-spacer { flex: 1; }
    .profile-mini { padding: 12px 10px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.025); }
    .avatar { display: inline-grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: linear-gradient(145deg, var(--cyan), var(--violet)); color: #0b1220; font-weight: 800; font-size: 11px; }
    .profile-mini .avatar { float: left; margin-right: 8px; }
    .profile-mini strong { display: block; font-size: 12px; }
    .profile-mini small { color: var(--muted); font-size: 10px; }
    .main { min-width: 0; }
    .topbar { height: 73px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 4vw, 52px); border-bottom: 1px solid var(--line); background: rgba(9,13,24,.5); backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 10; }
    .breadcrumb { color: var(--subtle); font-family: var(--mono); font-size: 11px; }
    .breadcrumb b { color: var(--ink); font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .demo-pill { color: var(--yellow); border: 1px solid rgba(231,207,132,.2); background: rgba(231,207,132,.07); border-radius: 20px; padding: 6px 10px; font-family: var(--mono); font-size: 10px; }
    .content { padding: clamp(25px, 4vw, 52px); max-width: 1500px; margin: 0 auto; }
    .mobile-nav { display: none; }
    .view { animation: view-in .35s ease both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Dashboard */
    .hero-row { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 27px; }
    .hero-row h1 { margin-bottom: 9px; }
    .hero-row p { margin: 0; color: var(--muted); }
    .signal { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .signal i { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 13px var(--cyan); }
    .metric-card { padding: 18px; min-height: 124px; position: relative; overflow: hidden; }
    .metric-card:after { content: ""; position: absolute; right: -22px; bottom: -28px; width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(117,230,223,.12); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { font-size: 30px; font-weight: 800; letter-spacing: -.05em; margin: 8px 0 3px; }
    .metric-foot { color: var(--cyan); font-size: 11px; }
    .dash-main { grid-template-columns: minmax(0, 1.45fr) minmax(280px, .8fr); margin-top: 16px; align-items: start; }
    .mission { padding: 25px; min-height: 255px; background: radial-gradient(circle at 88% 5%, rgba(117,230,223,.13), transparent 13rem), linear-gradient(145deg, #15243e, #10192b); }
    .mission h3 { font-size: 23px; max-width: 480px; margin: 8px 0; }
    .mission p { color: var(--muted); max-width: 550px; }
    .mission .mission-icon { width: 45px; height: 45px; display: grid; place-items: center; border: 1px solid rgba(117,230,223,.24); border-radius: 12px; color: var(--cyan); }
    .action-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .action-link { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 12px; transition: .2s; }
    .action-link:hover { color: var(--ink); border-color: var(--line-strong); transform: translateY(-2px); }
    .action-link .plus { color: var(--cyan); font-size: 18px; line-height: 1; }
    .chart-card { min-height: 255px; }
    .chart { width: 100%; height: 155px; }
    .chart svg { width: 100%; height: 100%; overflow: visible; }
    .chart-grid-line { stroke: rgba(173,192,227,.1); stroke-width: 1; }
    .chart-area { fill: url(#chartGradient); opacity: .25; }
    .chart-line { fill: none; stroke: var(--cyan); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .chart-dot { fill: var(--panel); stroke: var(--cyan); stroke-width: 2; }
    .activity-list { display: grid; gap: 13px; }
    .activity { display: flex; gap: 11px; align-items: start; }
    .activity-mark { width: 27px; height: 27px; display: grid; place-items: center; flex: 0 0 auto; color: var(--cyan); border: 1px solid rgba(117,230,223,.25); border-radius: 8px; font-family: var(--mono); font-size: 11px; }
    .activity p { font-size: 12px; margin: 0; color: var(--muted); }
    .activity strong { color: var(--ink); font-weight: 600; }
    .focus-card { padding: 21px; }
    .focus-card .focus-bar { margin: 14px 0 8px; }
    .focus-card .focus-meta { display: flex; justify-content: space-between; color: var(--subtle); font-size: 11px; }
    .insight-card { padding: 21px; border-color: rgba(169,155,255,.23); background: radial-gradient(circle at 100% 0, rgba(169,155,255,.15), transparent 15rem), linear-gradient(145deg, rgba(28,35,63,.96), rgba(14,22,39,.94)); }

    /* Forms and cards */
    .field { display: grid; gap: 7px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .field input, .field textarea, .field select {
      width: 100%; color: var(--ink); background: rgba(7,12,23,.65); border: 1px solid var(--line);
      border-radius: 9px; padding: 11px 12px; min-height: 43px;
    }
    .field textarea { min-height: 95px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: #52617c; }
    .field select option { background: #11192b; }
    .field input[type="range"] { padding: 0; accent-color: var(--cyan); min-height: auto; }
    .range-value { color: var(--cyan); font-family: var(--mono); font-size: 12px; }
    .check-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-choice { position: relative; }
    .check-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .check-choice label { display: inline-flex; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 12px; transition: .2s; }
    .check-choice input:checked + label { color: var(--cyan); border-color: rgba(117,230,223,.45); background: rgba(117,230,223,.1); }
    .article-card { padding: 20px; min-height: 250px; display: flex; flex-direction: column; }
    .article-card .article-graphic { position: relative; overflow: hidden; height: 150px; margin: -20px -20px 18px; background: linear-gradient(120deg, rgba(117,230,223,.12), rgba(169,155,255,.09)); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
    .article-card .article-graphic img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }

  function modal(title, subtitle, body, actions="") {
    currentModal = true;
    try { lastFocusedElement = document.activeElement; } catch(e) { lastFocusedElement = null; }
    // Use aria-labelledby for better screen reader support and mark the close button as an explicit button
    document.getElementById("modalRegion").innerHTML = '<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-head"><div><h2 id="modal-title">'+escapeHTML(title)+'</h2>'+(subtitle?'<p class="muted">'+escapeHTML(subtitle)+'</p>':"")+'</div><button type="button" class="btn ghost icon" data-action="close-modal" aria-label="Cerrar">'+icons.close+'</button></div>'+body+actions+'</div></div>';
    // move focus into modal and prevent background scroll
    const modalEl = document.getElementById("modalRegion").querySelector('.modal');
    if (modalEl && modalEl.focus) setTimeout(() => modalEl.focus(), 60);
    try { document.body.style.overflow = 'hidden'; } catch(e) {}
    // Mark background content as hidden for assistive tech while modal is open
    try {
      const main = document.querySelector('main'); const aside = document.querySelector('aside'); const splash = document.getElementById('splash');
      if (main) main.setAttribute('aria-hidden','true');
      if (aside) aside.setAttribute('aria-hidden','true');
      if (splash) splash.setAttribute('aria-hidden','true');
    } catch(e) {}
    // focus trap: keep Tab within modal
    try {
      if (modalEl) {
        modalKeydownHandler = function(evt) {
          if (evt.key !== 'Tab') return;
          const focusable = modalEl.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])');
          const nodes = Array.prototype.slice.call(focusable).filter(n => n.offsetWidth || n.offsetHeight || n.getClientRects().length);
          if (!nodes.length) return;
          const first = nodes[0]; const last = nodes[nodes.length-1];
          if (evt.shiftKey) {
            if (document.activeElement === first) { evt.preventDefault(); last.focus(); }
          } else {
            if (document.activeElement === last) { evt.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener('keydown', modalKeydownHandler);
      }
    } catch(e) {}
  }
  function closeModal() { currentModal = null; try { /* restore aria-hidden */ try { const main=document.querySelector('main'); const aside=document.querySelector('aside'); const splash=document.getElementById('splash'); if(main) main.removeAttribute('aria-hidden'); if(aside) aside.removeAttribute('aria-hidden'); if(splash) splash.removeAttribute('aria-hidden'); }catch(e){} document.getElementById("modalRegion").innerHTML = ""; document.body.style.overflow = ''; if (modalKeydownHandler) { document.removeEventListener('keydown', modalKeydownHandler); modalKeydownHandler = null; } if (lastFocusedElement && lastFocusedElement.focus) lastFocusedElement.focus(); } catch(e) {} lastFocusedElement = null; }

     ========================================================= */
  function go(next) { route=next; closeModal(); coachOpen=false; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  function render() {
    document.querySelectorAll(".coach, .tour-layer").forEach(node => node.remove());
    if (onboardingMode) return renderOnboarding();
    if (!state.onboarding.complete && !state.user) return renderAccount();
    if (state.onboarding.complete || state.user) fadeOutOnboardingAudio();
    document.getElementById("root").innerHTML = appShell();
    const view = document.getElementById("view");
    const views = {dashboard:renderDashboard,learn:renderLearn,lab:renderLab,planner:renderPlanner,insights:renderInsights,goals:renderGoals,profile:renderProfile,settings:renderSettings};
    view.innerHTML = (views[route] || renderDashboard)();
    if (coachOpen) renderCoach();
    if (!state.tour.complete && !state.demoMode && state.user) renderTour();
  }
  function appShell() {
    const name=state.user?.name||"Investigador"; const current=navItems.find(x=>x[0]===route)?.[1]||"Inicio";
    return '<div class="app-shell"><aside class="sidebar"><div class="side-brand">'+brandMark()+'<strong>NEXUS</strong></div><div class="side-label">Laboratorio</div><nav class="nav-list" aria-label="Navegación principal">'+navItems.slice(0,5).map(n=>nav(n)).join("")+'</nav><div class="side-label" style="margin-top:18px">Sistema</div><nav class="nav-list">'+navItems.slice(5).map(n=>nav(n)).join("")+'<button class="nav-item" data-action="open-coach" aria-label="Abrir NEXUS Coach">'+icons.coach+'<span>AI Coach</span></button></nav><div class="sidebar-spacer"></div><div class="profile-mini"><span class="avatar">'+initials(name)+'</span><strong>'+escapeHTML(name)+'</strong><small>Nivel '+levelName()+' · '+state.gamification.xp+' XP</small></div></aside><main class="main"><header class="topbar"><span class="breadcrumb">NEXUS / <b>'+escapeHTML(current)+'</b></span><div class="top-actions">'+(state.demoMode?'<span class="demo-pill">MODO DEMO</span>':"")+'<button class="btn ghost icon" data-action="open-coach" aria-label="Abrir NEXUS Coach">'+icons.coach+'</button><button class="btn ghost icon" data-route="profile" aria-label="Abrir perfil">'+icons.user+'</button></div></header><div id="view" class="content"></div></main><nav class="mobile-nav" aria-label="Navegación móvil">'+navItems.slice(0,5).map(n=>'<button type="button" class="'+(route===n[0]?"active":"")+'" data-route="'+n[0]+'" aria-label="'+escapeHTML(n[1])+'">'+icons[n[2]]+'<span>'+n[1]+'</span></button>').join("")+'</nav></div>';
  }
  function nav(n) { return '<button type="button" class="nav-item '+(route===n[0]?"active":"")+'" data-route="'+n[0]+'" aria-label="'+escapeHTML(n[1])+'">'+icons[n[2]]+'<span>'+n[1]+'</span></button>'; }

  /* =========================================================
     DASHBOARD
     ========================================================= */
  function renderDashboard() {
    const st=statValues(), name=state.user?.name?.split(" ")[0]||"Investigador", active=state.experiments.find(x=>x.status==="active"), goal=state.goals[0], recent=state.sessions.slice(-5).reverse();
    const values=state.sessions.slice(-8).map(x=>x.performance); const path=chartPath(values.length?values:[40,52,49,68,61,75,72,82]);
    return '<section class="view"><div class="hero-row"><div><span class="eyebrow">CENTRO DE OPERACIONES</span><h1>Hola, '+escapeHTML(name)+'.</h1><p>Tu aprendizaje está evolucionando. Hoy puedes observar una variable y hacer una prueba pequeña.</p></div><div class="signal"><i></i> Sistema atento a tus datos</div></div><div class="grid grid-4">'+metric("Dominio promedio",st.domain+"%",st.domain?"A partir de sesiones registradas":"Aún sin sesiones","graph")+metric("Sesiones",st.sessions,"+20 XP por completar","calendar")+metric("Experimentos",st.experiments,"+30 XP al crear","flask")+metric("Racha",st.streak+" días","Constancia observable","spark")+'</div><div class="grid dash-main"><div class="stack"><div class="card mission"><div class="mission-icon">'+icons.spark+'</div><span class="eyebrow" style="display:block;margin-top:16px">MISIÓN DE HOY</span><h3>Realizar una sesión de recuperación de 20 minutos.</h3><p>Intenta recordar antes de consultar. El objetivo es observar qué información está disponible, no demostrar una perfección.</p><div class="action-row"><button class="btn primary small" data-action="new-session">Iniciar misión '+icons.arrow+'</button><button class="btn ghost small" data-action="open-coach">Preguntar al Coach</button></div></div><div class="grid grid-2"><div class="card pad chart-card"><div class="card-header"><div><span class="eyebrow">TRAYECTORIA</span><h3 style="margin-top:6px">Rendimiento observado</h3></div><span class="badge observation">OBSERVACIÓN</span></div><div class="chart">'+lineChart(path)+'</div><div class="space-between tiny"><span>Sesiones recientes</span><span>Hoy</span></div></div><div class="card focus-card">'+(goal?'<div class="card-header"><div><span class="eyebrow">OBJETIVO ACTIVO</span><h3 style="margin-top:6px">'+escapeHTML(goal.title)+'</h3></div>'+icons.target+'</div><p class="muted" style="font-size:12px">Una dirección concreta puede convertir el tiempo disponible en oportunidades de aprendizaje.</p><div class="focus-bar"><div class="progress-track"><div class="progress-fill" style="width:'+goal.progress+'%"></div></div></div><div class="focus-meta"><span>'+goal.progress+'% de progreso</span><span>'+escapeHTML(goal.date||"Sin fecha")+'</span></div><button class="btn ghost small" style="margin-top:17px" data-route="planner">Ver plan '+icons.arrow+'</button>':'<span class="eyebrow">PRÓXIMA DIRECCIÓN</span>'+emptyState("Todavía no tienes un objetivo","Define una dirección y NEXUS convertirá tu tiempo disponible en sesiones.","new-goal","Crear objetivo"))+'</div></div></div><div class="stack"><div class="card insight-card"><div class="card-header"><div><span class="eyebrow">INSIGHT RECIENTE</span><h3 style="margin-top:6px">Hay algo interesante en tus datos.</h3></div><span class="badge observation">OBSERVACIÓN</span></div><p class="muted" style="font-size:12px">'+escapeHTML(state.insights[0]||"Cuando registres varias sesiones, NEXUS buscará patrones prudentes en tus datos.")+'</p><button class="btn ghost small" data-route="insights">Explorar patrones '+icons.arrow+'</button></div><div class="card pad"><div class="card-header"><div><span class="eyebrow">ACTIVIDAD RECIENTE</span><h3 style="margin-top:6px">Señales del laboratorio</h3></div></div><div class="activity-list">'+(recent.length?recent.map((x,i)=>'<div class="activity"><span class="activity-mark">'+(i+1).toString().padStart(2,"0")+'</span><p><strong>'+escapeHTML(x.topic||"Sesión")+'</strong><br>'+escapeHTML(x.strategy||"Registro")+' · '+(x.performance||0)+'% observado</p></div>').join(""):emptyState("Tu laboratorio empieza aquí","Completa una primera sesión para ver actividad real.","new-session","Nueva sesión"))+'</div></div></div></div><div class="card pad" style="margin-top:16px"><div class="card-header"><div><span class="eyebrow">ACCIONES RÁPIDAS</span><h3 style="margin-top:6px">¿Qué quieres investigar ahora?</h3></div></div><div class="row"><button class="action-link" data-action="new-session"><span class="plus">+</span>Nueva sesión</button><button class="action-link" data-action="new-experiment"><span class="plus">+</span>Nuevo experimento</button><button class="action-link" data-action="memory-check"><span class="plus">+</span>Memory Check</button><button class="action-link" data-action="new-reflection"><span class="plus">+</span>Nueva reflexión</button><button class="action-link" data-action="new-goal"><span class="plus">+</span>Crear plan</button></div></div></section>';
  }
  function chartPath(values) { const max=Math.max(...values,100), min=Math.min(...values,0); return values.map(v=>Math.max(5,Math.min(95,(v-min)/(max-min||1)*80+10))); }
  function lineChart(values) { const pts=values.map((v,i)=>((i/(values.length-1||1))*380+10)+","+(150-v/100*125)).join(" "); const area="10,150 "+pts+" 390,150"; return '<svg viewBox="0 0 400 160" role="img" aria-label="Gráfica de rendimiento"><defs><linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#75e6df"/><stop offset="1" stop-color="#75e6df" stop-opacity="0"/></linearGradient></defs><path class="chart-grid-line" d="M10 35h380M10 78h380M10 120h380"/><polygon class="chart-area" points="'+area+'"/><polyline class="chart-line" points="'+pts+'"/>'+values.map((v,i)=>'<circle class="chart-dot" cx="'+(i/(values.length-1||1)*380+10)+'" cy="'+(150-v/100*125)+'" r="3.3"><title>'+v+'%</title></circle>').join("")+'</svg>'; }

  // Article card with image placeholder: place images at assets/images/articles/{id}.webp
  function articleCard(a) { const mark=state.articles[a.id]||{}; const imgSrc = a.image || 'assets/images/articles/'+a.id+'.webp';
    const imgHtml = '<div class="article-graphic"><img src="'+imgSrc+'" alt="'+escapeHTML(a.title)+'" onerror="this.onerror=null;this.src=\'assets/images/articles/default-article.svg\'"></div>';
    return '<article class="card article-card">'+imgHtml+'<span class="badge '+(a.evidence==="EVIDENCIA"?"evidence":"hypothesis")+'">'+a.evidence+'</span><span class="eyebrow">'+escapeHTML(a.category)+' · '+escapeHTML(a.time)+'</span><h3>'+escapeHTML(a.title)+'</h3><p>'+escapeHTML(a.summary)+'</p><div class="article-foot"><span class="tiny">'+escapeHTML(a.author)+(mark.read?" · Leído":"")+'</span><div class="article-actions"><button class="btn ghost small" data-action="open-article" data-id="'+a.id+'">'+(mark.read?"Revisar":"Leer")+'</button><button class="btn icon small '+(mark.saved?"primary":"ghost")+'" data-action="save-article" data-id="'+a.id+'" aria-label="Guardar artículo">'+(mark.saved?icons.check:"+")+'</button></div></div></article>'; }
  function openArticle(id) {
    const a=articles.find(x=>x.id===id); if(!a) return;
    const imgPath = a.image || 'assets/images/articles/'+a.id+'.webp';
    const imgBlock = '<div class="article-modal-visual" style="background-image:url(\''+imgPath+'\');background-color:rgba(10,14,24,.45);" title="'+escapeHTML(a.title)+'"></div>';
    // Build sections safely
    const sections = [];
    if (a.introduction) sections.push('<div><h4>Introducción</h4><p class="muted">'+escapeHTML(a.introduction)+'</p></div>');
    if (a.definition) sections.push('<div><h4>Definición</h4><p>'+escapeHTML(a.definition)+'</p></div>');
    if (a.deep) sections.push('<div><h4>Explicación detallada</h4><p class="lead" style="font-size:16px;color:var(--ink)">'+escapeHTML(a.deep)+'</p></div>');
    if (a.what_happens) sections.push('<div><h4>¿Qué ocurre durante el aprendizaje?</h4><p>'+escapeHTML(a.what_happens)+'</p></div>');
    if (a.research) sections.push('<div><h4>Qué dice la investigación</h4><p class="muted">'+escapeHTML(a.research)+'</p></div>');
    if (a.not_mean) sections.push('<div><h4>Qué no significa</h4><p>'+escapeHTML(a.not_mean)+'</p></div>');
    if (a.practical) sections.push('<div class="card pad" style="background:rgba(117,230,223,.05);box-shadow:none"><span class="eyebrow">APLICACIÓN PRÁCTICA</span><p style="margin:8px 0 0;color:var(--muted)">'+escapeHTML(a.practical)+'</p></div>');
    if (a.student_example) sections.push('<div><h4>Ejemplo práctico</h4><p class="muted">'+escapeHTML(a.student_example)+'</p></div>');
    if (a.interpretation_errors) sections.push('<div><h4>Errores de interpretación</h4><p>'+escapeHTML(a.interpretation_errors)+'</p></div>');
    if (a.limitations) sections.push('<div><h4>Limitaciones</h4><p class="muted">'+escapeHTML(a.limitations)+'</p></div>');
    // References
    let refsHtml = '';
    if (Array.isArray(a.references)) {
      refsHtml = '<ol style="padding-left:18px;margin:8px 0">'+a.references.map(r=>'<li class="tiny" style="margin-bottom:6px">'+escapeHTML(r)+'</li>').join('')+'</ol>';
    } else if (a.references) {
      refsHtml = '<p class="tiny">'+escapeHTML(a.references)+'</p>';
    }
    const body = imgBlock + '<div class="stack"><div class="row"><span class="badge '+(a.evidence==="EVIDENCIA"?"evidence":"hypothesis")+'">'+escapeHTML(a.evidence||'')+'</span><span class="chip">'+escapeHTML(a.time||'')+'</span></div>' + sections.join('') + '<div><h4>Referencias y fuentes</h4>'+refsHtml+'</div></div>';
    modal(a.title, a.author, body, '<div class="modal-actions"><button class="btn ghost" data-action="save-article" data-id="'+a.id+'">Guardar</button><button class="btn primary" data-action="create-from-article" data-id="'+a.id+'">Crear experimento '+icons.arrow+'</button></div>');
    state.articles[a.id]={...(state.articles[a.id]||{}),read:true}; saveState();
  }

  /* =========================================================
     LABORATORY + EXPERIMENTS
     ========================================================= */
  function renderLab() {
    const active=state.experiments.filter(x=>x.status==="active"), completed=state.experiments.filter(x=>x.status==="completed");
    return '<section class="view"><div class="section-head"><div><span class="eyebrow">OBSERVACIÓN / EXPERIMENTACIÓN</span><h2>Tu laboratorio de aprendizaje</h2><p>No aceptes una estrategia simplemente porque alguien dice que funciona. Ponla a prueba en tu contexto.</p></div><button class="btn primary" data-action="new-experiment">+ Nuevo experimento</button></div><div class="grid grid-2" style="margin-bottom:25px"><div class="card pad"><div class="card-header"><div><span class="eyebrow">ACTIVOS</span><h3 style="margin-top:5px">'+active.length+' preguntas abiertas</h3></div><span class="badge hypothesis">HIPÓTESIS</span></div>'+(active.length?'<div class="stack">'+active.map(experimentCard).join("")+'</div>':emptyState("Tu laboratorio todavía está vacío","Cada descubrimiento comienza con una pregunta.","new-experiment","Crear mi primer experimento"))+'</div><div class="card pad"><div class="card-header"><div><span class="eyebrow">SUGERENCIA</span><h3 style="margin-top:5px">Empieza con una comparación pequeña</h3></div>'+icons.spark+'</div><p class="muted">Elige una sola variable que puedas observar. Por ejemplo: recuperación antes de releer frente a releer directamente.</p><div class="notice"><span class="badge observation">OBSERVACIÓN</span><span>Una comparación no prueba una ley general. Puede darte una señal sobre tu contexto.</span></div></div></div><div class="section-head"><div><span class="eyebrow">HISTORIAL</span><h2 style="font-size:24px">Experimentos completados</h2></div></div><div class="grid grid-3">'+(completed.length?completed.map(experimentCard).join(""):emptyState("Aún no hay experimentos completados","Completa una comparación para que tu historial empiece a contar.","new-experiment","Diseñar experimento"))+'</div></section>';
  }
  function experimentCard(e) { return '<article class="card lab-card '+(e.status==="completed"?"completed":"")+'"><div class="space-between"><span class="badge '+(e.status==="completed"?"observation":"hypothesis")+'">'+(e.status==="completed"?"COMPLETADO":"ACTIVO")+'</span><span class="tiny">'+formatDate(e.createdAt?.slice(0,10))+'</span></div><h3>'+escapeHTML(e.title)+'</h3><p>'+escapeHTML(e.question||e.hypothesis)+'</p><div class="lab-meta"><span class="chip">'+escapeHTML(e.subject||"General")+'</span><span class="chip">'+escapeHTML(e.conditionA||"A")+' / '+escapeHTML(e.conditionB||"B")+'</span><span class="chip">'+(e.duration||7)+' días</span></div><div class="lab-actions">'+(e.status==="active"?'<button class="btn primary small" data-action="run-experiment" data-id="'+e.id+'">Iniciar sesión '+icons.play+'</button>':'<button class="btn ghost small" data-action="view-experiment" data-id="'+e.id+'">Ver evidencia</button>')+'</div></article>'; }
  function openExperimentModal(prefill={}) {
    const body='<form id="experimentForm" class="modal-form">'+field("Pregunta de investigación",'<textarea name="question" required placeholder="¿Qué quieres observar?">'+escapeHTML(prefill.question||"")+'</textarea>')+field("Hipótesis",'<textarea name="hypothesis" required placeholder="Creo que… porque…">'+escapeHTML(prefill.hypothesis||"")+'</textarea>')+'<div class="grid grid-2">'+field("Materia",'<input name="subject" required placeholder="Ej. Matemática" value="'+escapeHTML(prefill.subject||"")+'">')+field("Duración",'<select name="duration">'+selectOptions(["3","7","14"],String(prefill.duration||7))+'</select>')+'</div><div class="grid grid-2">'+field("Condición A",'<input name="conditionA" required placeholder="Ej. Recuperación activa" value="'+escapeHTML(prefill.conditionA||"Recuperación activa")+'">')+field("Condición B",'<input name="conditionB" required placeholder="Ej. Relectura" value="'+escapeHTML(prefill.conditionB||"Relectura")+'">')+'</div>'+field("Métricas a observar",'<div class="check-grid">'+["precision","recuerdo","confianza","tiempo","dificultad","fatiga"].map((x,i)=>'<span class="check-choice"><input id="m'+i+'" type="checkbox" name="metrics" value="'+x+'" '+(i<3?"checked":"")+'><label for="m'+i+'">'+x.charAt(0).toUpperCase()+x.slice(1)+'</label></span>').join("")+'</div>')+'<div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Crear experimento '+icons.arrow+'</button></div></form>';
    modal("Diseñar un experimento","Una pregunta concreta convierte una intuición en algo que podemos observar.",body);
  }
  function saveExperiment(form) { const d=new FormData(form); const e={id:uid("exp"),title:d.get("question").toString().slice(0,48),question:d.get("question"),hypothesis:d.get("hypothesis"),subject:d.get("subject"),conditionA:d.get("conditionA"),conditionB:d.get("conditionB"),duration:Number(d.get("duration")),metrics:d.getAll("metrics"),status:"active",createdAt:new Date().toISOString()}; state.experiments.push(e); saveState(); closeModal(); xp(30,"Experimento creado."); go("lab"); }
  function openRunModal(id, plannerId=null) {
    const e=plannerId?state.planner.sessions.find(x=>x.id===plannerId):state.experiments.find(x=>x.id===id) || {topic:"Sesión de recuperación",duration:20,title:"Sesión de recuperación"}; if(!e) return;
    const body='<form id="runForm" class="modal-form" data-exp="'+(id||"")+'" data-plan="'+(plannerId||"")+'"><div class="card pad" style="background:rgba(117,230,223,.05);box-shadow:none"><span class="eyebrow">ANTES DE EMPEZAR</span><h3 style="margin:7px 0">¿Qué rendimiento esperas obtener?</h3>'+field("Predicción",'<div class="space-between"><input id="prediction" name="prediction" type="range" min="0" max="100" value="70" oninput="document.getElementById(\'predictionVal\').textContent=this.value+\'%\'"><span class="range-value" id="predictionVal">70%</span></div>')+'</div>'+field("Tema de la sesión",'<input name="topic" required value="'+escapeHTML(e.topic||e.title||"Exploración")+'">')+field("Duración estimada",'<select name="duration">'+selectOptions(["15","20","25","45","60"],String(e.duration||25))+'</select>')+'<p class="tiny">Al terminar registrarás confianza, dificultad, fatiga y rendimiento observado.</p><div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Comenzar temporizador '+icons.play+'</button></div></form>';
    modal("Iniciar sesión", "Una predicción hace visible tu calibración metacognitiva.",body);
  }
  function startRun(form) {
    const d=new FormData(form), id=form.dataset.exp, plan=form.dataset.plan; const body='<form id="finishForm" class="modal-form" data-exp="'+id+'" data-plan="'+plan+'" data-prediction="'+d.get("prediction")+'" data-topic="'+escapeHTML(d.get("topic"))+'" data-duration="'+d.get("duration")+'"><div class="card pad" style="text-align:center;background:rgba(169,155,255,.08);box-shadow:none"><span class="eyebrow">SESIÓN EN CURSO</span><div class="metric-value" id="timer">00:00</div><p class="muted" style="margin:0">Puedes finalizar cuando hayas completado tu actividad.</p></div>'+field("¿Qué tan seguro estás de tu rendimiento?",'<div class="space-between"><input name="confidence" type="range" min="0" max="100" value="75" oninput="document.getElementById(\'confidenceVal\').textContent=this.value+\'%\'"><span class="range-value" id="confidenceVal">75%</span></div>')+field("Dificultad percibida",'<div class="space-between"><input name="difficulty" type="range" min="1" max="10" value="5" oninput="document.getElementById(\'difficultyVal\').textContent=this.value"><span class="range-value" id="difficultyVal">5</span></div>')+field("Fatiga",'<div class="space-between"><input name="fatigue" type="range" min="1" max="10" value="3" oninput="document.getElementById(\'fatigueVal\').textContent=this.value"><span class="range-value" id="fatigueVal">3</span></div>')+field("Rendimiento observado",'<div class="space-between"><input name="performance" type="range" min="0" max="100" value="68" oninput="document.getElementById(\'performanceVal\').textContent=this.value+\'%\'"><span class="range-value" id="performanceVal">68%</span></div>')+'<div class="modal-actions"><button class="btn primary" type="submit">Guardar sesión '+icons.check+'</button></div></form>';
    modal("Registrar evidencia","Los números son observaciones de esta sesión, no medidas de tu valor.",body);
    let seconds=0; const interval=setInterval(()=>{const el=document.getElementById("timer");if(!el){clearInterval(interval);return;}seconds++;el.textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");},1000);
  }
  function finishRun(form) {
    const d=new FormData(form), session={id:uid("session"),date:todayISO(),topic:d.get("topic"),strategy:"Recuperación",prediction:Number(form.dataset.prediction),performance:Number(d.get("performance")),confidence:Number(d.get("confidence")),difficulty:Number(d.get("difficulty")),fatigue:Number(d.get("fatigue")),duration:Number(form.dataset.duration),completed:true};
    state.sessions.push(session); if(form.dataset.exp){const e=state.experiments.find(x=>x.id===form.dataset.exp);if(e){e.status="completed";e.result=session.performance;}} if(form.dataset.plan){const p=state.planner.sessions.find(x=>x.id===form.dataset.plan);if(p)p.status="done";}
    state.gamification.streak=Math.max(state.gamification.streak,1); saveState(); closeModal(); xp(20,"Sesión completada."); openReflectionModal(session.id);

    try {
      if (coachEl) {
        coachKeydownHandler = function(evt){ if (evt.key !== 'Tab') return; const focusable = coachEl.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'); const nodes = Array.prototype.slice.call(focusable).filter(n=> n.offsetWidth || n.offsetHeight || n.getClientRects().length); if (!nodes.length) return; const first = nodes[0], last = nodes[nodes.length-1]; if (evt.shiftKey) { if (document.activeElement === first) { evt.preventDefault(); last.focus(); } } else { if (document.activeElement === last) { evt.preventDefault(); first.focus(); } } };
        document.addEventListener('keydown', coachKeydownHandler);
      }
    } catch(e) {}
  }
  function formatMessage(text) { return escapeHTML(text).replace(/\n/g,"<br>"); }
  function coachResponse(q) {
    const text=q.toLowerCase(), st=statValues(), gap=st.sessions?avg(state.sessions,"confidence")-avg(state.sessions,"performance"):0, name=state.user?.name?.split(" ")[0]||"";
    if(text.includes("espaci")||text.includes("distribu")) return {text:"La práctica espaciada consiste en distribuir oportunidades de estudio o recuperación en el tiempo. Puede favorecer la retención, pero la separación exacta depende del contenido, la tarea y tu objetivo. En tu caso, podríamos registrarla como una condición y observar qué ocurre.",source:"Cepeda et al. (2006), práctica distribuida; referencia conceptual cargada en NEXUS."};
    if(text.includes("recuper")||text.includes("recordar antes")) return {text:"Intentar recordar antes de mirar hace visible qué información puedes producir sin apoyo. No es un examen sobre tu valor: es una forma de encontrar qué conviene recuperar después. Puedes probarlo con cinco preguntas y registrar tu confianza.",source:"Roediger & Karpicke (2006), test-enhanced learning."};
    if(text.includes("metacogn")) return {text:"La metacognición es pensar sobre el propio pensamiento: detectar qué comprendes, anticipar un resultado, elegir una estrategia y revisar si funcionó. NEXUS la trata como una capacidad que se puede observar en contexto, no como una etiqueta fija.",source:"Flavell (1979), metacognitive and cognitive monitoring."};
    if(text.includes("previo")||text.includes("qué sé")) return {text:"Preguntarte qué sabes permite hacer visible un punto de partida. Una idea nueva puede encontrar conexiones con conocimientos previos, y esas conexiones pueden orientar ejemplos, preguntas o una explicación.",source:"Ausubel (1968), aprendizaje significativo."};
    if(text.includes("organ")||text.includes("semana")||text.includes("plan")) return {text:"Tu plan actual tiene "+(state.planner.sessions.length||0)+" sesiones. La propuesta es alternar activación, recuperación y reflexión, dejando espacio entre oportunidades. No es una receta: si una sesión no encaja, puedes reprogramarla y registrar por qué.",source:"NEXUS Planner · práctica distribuida y autorregulación."};
    if(text.includes("concentr")||text.includes("distrac")) return {text:"Podemos reducir variables sin asumir que existe un entorno perfecto: silenciar notificaciones, definir una tarea concreta, preparar materiales y elegir una duración sostenible. Después registra qué condición estuvo presente y cómo te fue.",source:"Recomendación contextual; no supone que el silencio sea universalmente mejor."};
    if(text.includes("músic")) return {text:"La música puede interactuar de forma distinta con la tarea y tu contexto. En vez de decidir que es buena o mala para todos, compara dos sesiones similares y registra distractores, fatiga y rendimiento.",source:"No se ha cargado una referencia específica para esta respuesta."};
    if(text.includes("larg")||text.includes("muchas horas")) return {text:"Más tiempo no equivale automáticamente a más aprendizaje. Tus datos muestran "+(st.sessions?st.sessions+" sesiones registradas":"aún no hay sesiones suficientes")+"; podemos observar duración, finalización y rendimiento antes de sacar una conclusión sobre tu contexto.",source:"NEXUS · observación prudente sobre tiempo y aprendizaje."};
    if(text.includes("confianza")||text.includes("resultado")) return {text:st.sessions?("En tus registros, la confianza promedio es "+avg(state.sessions,"confidence")+"% y el rendimiento observado "+avg(state.sessions,"performance")+"%. La diferencia actual es de "+Math.abs(gap)+" puntos. Podría ser útil predecir, hacer la sesión y comparar sin convertirlo en una etiqueta."): "Todavía no hay sesiones suficientes para comparar confianza y rendimiento. La próxima sesión puede incluir una predicción.",source:"NEXUS · calibración metacognitiva basada en tus registros."};
    if(text.includes("retenc")||text.includes("olvid")) return {text:"Olvidar parte de lo estudiado no demuestra incapacidad. Es información sobre qué se recupera en un momento concreto. Podemos crear oportunidades posteriores de recuperación y observar cómo cambia la retención.",source:"Ebbinghaus (1885/1913), historia experimental de la memoria; no es un calendario personal."};
    if(text.includes("experimento")) return {text:"Un experimento NEXUS empieza con una pregunta, una hipótesis y dos condiciones que puedas comparar. Elige una métrica sencilla, registra una sesión por condición y reflexiona sobre qué pudo influir. Puedes crear uno desde el Laboratorio.",source:"NEXUS Lab · diseño de comparación personal."};
    if(text.includes("perfil")) return {text:"Tu perfil resume respuestas y registros actuales. En este momento, "+st.sessions+" sesiones y "+state.experiments.length+" experimentos forman parte de la observación. No dice “tu cerebro es así”: cambia a medida que incorporas evidencia.",source:"NEXUS · perfil como hipótesis evolutiva."};
    if(text.includes("interés")||text.includes("no me interesa")) return {text:"El interés no tiene que ser una condición previa perfecta. Podemos separar curiosidad, relevancia y disposición: quizá un tema sea importante aunque hoy no despierte curiosidad. Prueba conectarlo con una pregunta concreta o elegir una tarea breve.",source:"NEXUS · interés, relevancia y disposición como variables distintas."};
    if(text.includes("ganas")||text.includes("motiv")) return {text:"No necesitas esperar a sentir una motivación constante. Puedes reducir el inicio a una acción concreta y breve, definir qué observarás y dejar que la información de la sesión guíe el siguiente ajuste.",source:"Zimmerman (2002), autorregulación del aprendizaje."};
    if(text.includes("matemát")) return {text:"Puedes empezar con un objetivo concreto, como resolver un tipo de problema sin mirar un ejemplo. Predice tu rendimiento, intenta recuperar el procedimiento y registra dónde aparece la dificultad. Si quieres, crea un objetivo de Matemática en el Planificador.",source:"NEXUS · aplicación contextual de recuperación y reflexión."};
    if(text.includes("qué has aprendido")||text.includes("datos")) return {text:""+(name?name+", ":"")+"en tus datos actuales observo "+st.sessions+" sesiones, "+state.experiments.length+" experimentos y una media de rendimiento de "+st.domain+"%. Esto es un punto de partida: todavía no es una conclusión sobre ti.",source:"NEXUS · lectura de localStorage."};
    if(text.includes("hoy")||text.includes("recomend")) return {text:"Hoy te propongo una sesión de "+(state.planner.sessions.find(x=>x.status!=="done")?.duration||20)+" minutos: define una pregunta, intenta recuperar antes de consultar y registra tu confianza. La misión es obtener una observación pequeña y clara.",source:"NEXUS · recomendación contextual basada en tu agenda local."};
    if(text.includes("demostrad")||text.includes("evidencia")||text.includes("ciencia")) return {text:"La evidencia depende del concepto y de la pregunta. NEXUS distingue entre evidencia científica, observaciones de tus registros e hipótesis provisionales. Si no hay una referencia concreta cargada, te lo diré en lugar de inventarla.",source:"NEXUS · principio de seguridad conceptual."};
    return {text:"No quiero adivinar una conclusión. Podemos convertir tu pregunta en una observación: elige una sesión, una condición y una métrica sencilla. Si me cuentas un poco más, intentaré relacionarlo con tus datos actuales.",source:"No se ha cargado una referencia específica para esta respuesta."};
  }
  function sendCoach(message) { const r=coachResponse(message); state.chat.push({role:"user",text:message}); state.chat.push({role:"coach",text:r.text,source:r.source}); coachOpen=true; saveState(); render(); }

  /* =========================================================
     TOUR + DEMO + ACTIONS
     ========================================================= */
  const tourCopy=[["Inicio","Tu centro de operaciones. Aquí se encuentran tus señales recientes y la misión de hoy."],["Aprender","La biblioteca científica. Lee una idea y conviértela en una pregunta para tu contexto."],["Laboratorio","Tu espacio de experimentación. Las hipótesis se vuelven comparaciones observables."],["Planificador","Convierte objetivos en oportunidades de aprendizaje, con reglas que puedes entender y ajustar."],["Insights","Descubre patrones en tus propios datos sin convertirlos en verdades universales."],["AI Coach","Obtén recomendaciones contextuales que distinguen evidencia, observación e hipótesis."],["Perfil","Observa cómo evoluciona tu sistema de aprendizaje a través del tiempo."]];
  function renderTour() { const [title,text]=tourCopy[tourStep]||tourCopy[0]; document.body.insertAdjacentHTML("beforeend",'<div class="tour-layer" id="tourLayer"><div class="tour-card" role="dialog" aria-modal="true"><span class="eyebrow">PRIMERA EXPLORACIÓN · '+(tourStep+1)+' / 7</span><h3 style="margin-top:8px">'+title+'</h3><p>'+text+'</p><div class="space-between"><button type="button" class="btn ghost small" data-action="skip-tour">Saltar tour</button><button type="button" class="btn primary small" data-action="next-tour">'+(tourStep===6?"Entrar al sistema":"Siguiente")+' '+icons.arrow+'</button></div></div></div>');
    try { const tourEl=document.getElementById('tourLayer'); if(tourEl){ const card=tourEl.querySelector('.tour-card'); if(card){ card.setAttribute('tabindex','-1'); setTimeout(()=>{ try{ card.focus(); }catch(e){} },30); } const main=document.querySelector('main'); const aside=document.querySelector('aside'); const splash=document.getElementById('splash'); if(main) main.setAttribute('aria-hidden','true'); if(aside) aside.setAttribute('aria-hidden','true'); if(splash) splash.setAttribute('aria-hidden','true'); // focus trap
      try { tourKeydownHandler = function(evt){ if(evt.key!=='Tab') return; const focusable = card.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'); const nodes=Array.prototype.slice.call(focusable).filter(n=> n.offsetWidth||n.offsetHeight||n.getClientRects().length); if(!nodes.length) return; const first=nodes[0], last=nodes[nodes.length-1]; if(evt.shiftKey){ if(document.activeElement===first){ evt.preventDefault(); last.focus(); } } else { if(document.activeElement===last){ evt.preventDefault(); first.focus(); } } }; document.addEventListener('keydown', tourKeydownHandler); } catch(e){} }
    } catch(e){}
  }
  function nextTour() { try{ const main=document.querySelector('main'); const aside=document.querySelector('aside'); const splash=document.getElementById('splash'); if(main) main.removeAttribute('aria-hidden'); if(aside) aside.removeAttribute('aria-hidden'); if(splash) splash.removeAttribute('aria-hidden'); if(tourKeydownHandler){ document.removeEventListener('keydown', tourKeydownHandler); tourKeydownHandler=null; } }catch(e){} document.getElementById("tourLayer")?.remove(); if(tourStep<6){tourStep++;renderTour();}else{state.tour.complete=true;saveState();toast("Tour completado","success","El laboratorio queda listo para ti.");} }
  function loadDemo() { state=demoData(); onboardingMode=false; document.getElementById("splash").classList.add("fade"); saveState(); route="dashboard"; render(); toast("Modo demo cargado","success","NEXUS tiene datos vivos para explorar."); }
  function resetData() { if(confirm("¿Restablecer todos los datos locales de NEXUS?")){localStorage.removeItem(STORAGE_KEY);state=blankState();onboardingMode=false;route="dashboard";closeModal();showSplash();toast("Datos restablecidos","success");} }
  function openMemoryCheck() {
    const session=state.sessions[state.sessions.length-1]; const body='<form id="memoryForm" class="modal-form">'+(session?'<div class="notice"><span>'+icons.calendar+'</span><div><strong>Recuperación programada</strong>Estudiaste <b>'+escapeHTML(session.topic)+'</b> en una sesión reciente. ¿Qué puedes recuperar sin consultar?</div></div>':notice("Aún no hay una sesión","Completa una primera sesión para programar un Memory Check."))+field("Escribe lo que recuerdas",'<textarea name="answer" required placeholder="No consultes tus apuntes todavía…"></textarea>')+field("¿Cuánto crees que recuperaste?",'<div class="space-between"><input name="retention" type="range" min="0" max="100" value="60" oninput="document.getElementById(\'retentionVal\').textContent=this.value+\'%\'"><span class="range-value" id="retentionVal">60%</span></div>')+'<div class="modal-actions"><button class="btn primary" type="submit">Guardar Memory Check '+icons.check+'</button></div></form>'; modal("Memory Check","Una pausa de recuperación para observar la retención.",body); }
  function saveMemory(form){const d=new FormData(form);state.insights.unshift("Tu último Memory Check registró una retención declarada de "+d.get("retention")+"%. Podría ser útil volver a recuperar este contenido más adelante.");saveState();closeModal();xp(15,"Memory Check guardado.");go("insights");}
  function goalProgress(id){const g=state.goals.find(x=>x.id===id);if(!g)return;g.progress=Math.min(100,g.progress+10);g.sessions++;saveState();toast("Objetivo actualizado","success","Has registrado un avance de "+g.progress+"%.");render();}

  /* =========================================================
     EVENTS + BOOT
     ========================================================= */
  // Prevent accidental form submissions: buttons with data-action should not submit forms
  document.addEventListener("click", event => {
    const btn = event.target.closest('button[data-action]');
    if (btn && btn.form && btn.type !== 'submit') {
      try { event.preventDefault(); } catch (e) {}
    }
  });
  document.addEventListener("click", event => {
    const target=event.target.closest("[data-action],[data-route],[data-coach-suggest]"); if(!target)return;
    // If the matched element is the modal backdrop's close action, but the click occurred
    // inside the modal content, ignore it so inner controls (including submit buttons
    // without data-action) are handled normally by form/submit handlers.
    if (target.dataset.action === 'close-modal' && target.classList && target.classList.contains('modal-backdrop') && event.target.closest('.modal')) {
      return;
    }
    // Coach suggestions are already handled locally in renderCoach(); ignore the delegated version here.
    if (target.dataset.coachSuggest && target.closest('.coach')) {
      return;
    }
    const action=target.dataset.action;
    if(target.dataset.route){go(target.dataset.route);return;}
    if(target.dataset.coachSuggest){if(!coachOpen){coachOpen=true;render();}sendCoach(target.dataset.coachSuggest);return;}
    if(action==="start-onboarding")startOnboarding(true);
    else if(action==="continue-saved"){document.getElementById("splash").classList.add("fade"); if(state.demoMode){ state.demoMode = false; saveState(); } if(state.onboarding.complete){onboardingMode=false;render();}else{onboardingMode=true;storyStep=state.onboarding.scene||0;renderOnboarding();}}
    else if(action==="load-demo")loadDemo();
    else if(action==="next-scene")nextScene();
    else if(action==="prev-scene"){try{ if(ONBOARDING_SFX.playOnBack) playOnboardingSFX('back'); }catch(e){} storyStep=Math.max(0,storyStep-1);renderOnboarding();}
    else if(action==="prev-assessment"){assessmentStep=Math.max(0,assessmentStep-1);renderAssessment();}
    else if(action==="go-account")renderAccount();
    else if(action==="guest-account"){state.user={name:"Investigador",email:"Modo invitado"};state.onboarding.complete=true;state.tour.complete=false;saveState();render();toast("Laboratorio preparado","success","Tu exploración empieza en modo invitado.");}
    else if(action==="close-modal")closeModal();
    else if(action==="open-coach"){coachOpen=true;render();}
    else if(action==="close-coach"){document.querySelector(".coach")?.remove();coachOpen=false; try{ /* restore aria-hidden */ const main=document.querySelector('main'); const aside=document.querySelector('aside'); const splash=document.getElementById('splash'); if(main) main.removeAttribute('aria-hidden'); if(aside) aside.removeAttribute('aria-hidden'); if(splash) splash.removeAttribute('aria-hidden'); if(coachKeydownHandler){ document.removeEventListener('keydown', coachKeydownHandler); coachKeydownHandler=null; } if(lastFocusedElement && lastFocusedElement.focus) lastFocusedElement.focus(); }catch(e){} lastFocusedElement=null;}
    else if(action==="new-experiment")openExperimentModal();
    else if(action==="new-goal")openGoalModal();
    else if(action==="new-session")openRunModal("mission");
    else if(action==="run-experiment")openRunModal(target.dataset.id);
    else if(action==="run-plan")openRunModal(null,target.dataset.id);
    else if(action==="new-reflection"){const s=state.sessions[state.sessions.length-1];if(s)openReflectionModal(s.id);else toast("Completa una sesión primero","error","La reflexión necesita una sesión para tener contexto.");}
    else if(action==="memory-check")openMemoryCheck();
    else if(action==="why-plan")whyPlan(target.dataset.id);
    else if(action==="reschedule")reschedule(target.dataset.id);
    else if(action==="open-article")openArticle(target.dataset.id);
    else if(action==="save-article"){const id=target.dataset.id;state.articles[id]={...(state.articles[id]||{}),saved:!(state.articles[id]?.saved)};saveState();toast(state.articles[id].saved?"Artículo guardado.":"Artículo quitado de guardados.");render();}
    else if(action==="create-from-article"){const a=articles.find(x=>x.id===target.dataset.id);closeModal();openExperimentModal({question:"¿Qué ocurre cuando pongo a prueba: "+a.title+"?",hypothesis:"Creo que aplicar esta idea puede cambiar una métrica en mi contexto.",subject:a.category,conditionA:"Aplicar la estrategia",conditionB:"Condición habitual"});}
    else if(action==="filter-learn"){window.learnCategory=target.dataset.value;render();}
    else if(action==="graph-node")graphInfo(Number(target.dataset.index));
    else if(action==="make-hypothesis"){const text=generateInsight();state.hypotheses.push({id:uid("hyp"),text,status:"active"});saveState();toast("Hipótesis creada","success","Ahora puedes probarla en el laboratorio.");render();}
    else if(action==="test-insight"||action==="test-hypothesis"){openExperimentModal({question:"¿Se repite este patrón en mi contexto?",hypothesis:generateInsight(),subject:"General",conditionA:"Recuperación activa",conditionB:"Estrategia habitual"});}
    else if(action==="goal-progress")goalProgress(target.dataset.id);
    else if(action==="skip-tour"){document.getElementById("tourLayer")?.remove();try{ const main=document.querySelector('main'); const aside=document.querySelector('aside'); const splash=document.getElementById('splash'); if(main) main.removeAttribute('aria-hidden'); if(aside) aside.removeAttribute('aria-hidden'); if(splash) splash.removeAttribute('aria-hidden'); if(tourKeydownHandler){ document.removeEventListener('keydown', tourKeydownHandler); tourKeydownHandler=null; } }catch(e){} state.tour.complete=true;saveState();}
    else if(action==="next-tour")nextTour();
    else if(action==="reset-data")resetData();
    else if(action==="view-experiment"){const e=state.experiments.find(x=>x.id===target.dataset.id);if(e)modal(e.title,"Evidencia registrada",'<div class="stack"><span class="badge observation">OBSERVACIÓN</span><p class="lead" style="font-size:17px;color:var(--ink)">Rendimiento observado: '+(e.result||"sin registrar")+'%</p><p class="muted">'+escapeHTML(e.hypothesis)+'</p></div>','<div class="modal-actions"><button class="btn primary" data-action="close-modal">Cerrar</button></div>');}
  });
  document.addEventListener("submit", event => {
    if (event.target.closest('.coach-form')) return;
    if(event.target.id==="assessmentForm"){event.preventDefault();submitAssessment(event.target);}
    else if(event.target.id==="accountForm"){event.preventDefault();const d=new FormData(event.target);state.user={name:d.get("name"),email:d.get("email")};state.onboarding.complete=true;state.tour.complete=false;saveState();render();toast("Cuenta creada","success","Tu laboratorio personal está listo.");}
    else if(event.target.id==="experimentForm"){event.preventDefault();saveExperiment(event.target);}
    else if(event.target.id==="runForm"){event.preventDefault();startRun(event.target);}
    else if(event.target.id==="finishForm"){event.preventDefault();finishRun(event.target);}
    else if(event.target.id==="reflectionForm"){event.preventDefault();saveReflection(event.target);}
    else if(event.target.id==="goalForm"){event.preventDefault();saveGoal(event.target);}
    else if(event.target.id==="memoryForm"){event.preventDefault();saveMemory(event.target);}
    else if(event.target.id==="coachForm"){event.preventDefault();const d=new FormData(event.target);sendCoach(d.get("message"));event.target.reset();}
  });
  document.addEventListener("change", event => { if(event.target.dataset.setting){state.settings[event.target.dataset.setting]=event.target.checked;saveState();toast("Preferencia guardada");} });
  loadState();
  if(state.onboarding.complete || state.user) { state.onboarding.complete=true; showSplash(); }
  else showSplash();

  // Ensure buttons using data-* attributes have explicit types, add aria-labels for icon-only buttons,
  // and observe DOM mutations so dynamically injected buttons are also fixed.
  (function ensureButtonTypes(){
    const ensure = () => {
      document.querySelectorAll('button[data-action], button[data-route], button[data-coach-suggest]').forEach(btn => {
        try {
          if (!btn.hasAttribute('type')) btn.setAttribute('type','button');
          const isIcon = btn.classList.contains('icon') || btn.classList.contains('nav-item') || btn.classList.contains('action-link') || btn.classList.contains('tab-btn');
          if (isIcon && !btn.hasAttribute('aria-label')) {
            const label = btn.dataset.action || btn.dataset.route || btn.dataset.coachSuggest || btn.textContent.trim().slice(0,40) || 'Acción';
            if (label) btn.setAttribute('aria-label', label);
          }
        } catch(e) {}
      });
    };
    try { ensure(); } catch(e) {}
    document.addEventListener('DOMContentLoaded', ensure);
    // Observe mutations to catch dynamically-rendered buttons
    try {
      const mo = new MutationObserver((records) => { ensure(); });
      mo.observe(document.body, { childList:true, subtree:true });
    } catch(e) {}
  })();
  </script>
